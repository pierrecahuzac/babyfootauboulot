services:
  - type: web
    name: babyfoot-api
    runtime: node
    plan: starter
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
        sync: false
      - key: DATABASE_URL
        sync: false # Neon URL avec ?sslmode=require
      - key: JWT_SECRET
        sync: false # 32+ chars, génère avec: openssl rand -base64 48
      - key: CORS_ORIGIN
        value: https://babyfoot-app.vercel.app,https://babyfoot-landing.vercel.app
        sync: false
      - key: ADMIN_EMAILS
        value: admin@example.com
        sync: false
      # Optionnel
      # - key: JWT_EXPIRES
      #   value: 7d
