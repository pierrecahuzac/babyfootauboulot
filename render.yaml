services:
  - type: web
    name: babyfootauboulot
    runtime: node
    plan: free # gratuit sans CB (sleep après 15min) - starter = 7$/mo
    rootDir: api
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Neon pooler ex: postgresql://neondb_owner:xxx@ep-xxx-pooler.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: JWT_SECRET
        sync: false # 32+ chars, génère avec: openssl rand -base64 48
      - key: CORS_ORIGIN
        value: https://babyfootauboulot.vercel.app,https://babyfootauboulot-landing.vercel.app
      - key: ADMIN_EMAILS
        sync: false # ex: cahuzac.p@gmail.com — à renseigner dans Render Dashboard (pas en git)
      # Optionnel
      # - key: JWT_EXPIRES
      #   value: 7d
