# koyeb.yaml — Déploiement API Babyfoot sur Koyeb (alternative gratuite à Render)
# Docs: https://www.koyeb.com/docs/reference/koyeb-yaml
# Usage: push sur main -> auto-deploy si connecté via GitHub
# Ou CLI: koyeb service create --definition koyeb.yaml

services:
  - name: babyfootauboulot-api
    type: web
    # Koyeb free: nano (0.1 vCPU, 512MB) suffit pour Fastify
    instance_type: nano
    regions: [fra] # francfort = proche de Neon eu-west-2
    scaling:
      min: 1
      max: 1
    # Source GitHub - adapter <ton-user>/<ton-repo>
    git:
      repository: github.com/pierrecahuzac/babyfootauboulot
      branch: main
      workdir: api
    build:
      docker:
        dockerfile: ./api/Dockerfile
    # Port exposé - doit matcher PORT env
    ports:
      - port: 8000
        protocol: http
        path: /
    routes:
      - path: /
        port: 8000
    # Healthcheck identique à api/src/app.js:163 -> GET /health
    health_checks:
      - protocol: http
        path: /health
        port: 8000
        interval: 30s
        timeout: 5s
        initial_delay: 10s
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000" # Koyeb exige 8000 par défaut
      # Secrets à renseigner dans le dashboard Koyeb (Variables > Secret)
      - key: DATABASE_URL
        # Ex: postgresql://neondb_owner:npg_xxx@ep-xxx-pooler.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
        secret: DATABASE_URL
      - key: JWT_SECRET
        secret: JWT_SECRET # 32+ chars: openssl rand -base64 48
      - key: CORS_ORIGIN
        value: https://app.babyfootauboulot.vercel.app,https://babyfootauboulot.vercel.app
      - key: ADMIN_EMAILS
        value: admin@example.com
      # Optionnel:
      # - key: JWT_EXPIRES
      #   value: 7d
