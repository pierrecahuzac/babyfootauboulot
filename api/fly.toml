# fly.toml — Déploiement API Babyfoot sur Fly.io (remplace Koyeb/Render)
# Docs: https://fly.io/docs/reference/configuration/
# Usage: fly launch (une fois) puis fly deploy --remote-only
# Secrets: fly secrets set DATABASE_URL="..." JWT_SECRET="..." --app babyfootauboulot-api

app = "babyfootauboulot-api"
primary_region = "cdg" # Paris - proche de Neon eu-west-2

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080" # Fly.io attend 8080 par défaut (ou 3000)

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend" # scale to zero quand inactif (économise $)
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512 # nano-like, suffisant pour Fastify
