# docker-compose.prod.yml — PRODUCTION (INTERDIT Drizzle Studio)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ⚠️ Ne JAMAIS inclure le profile "dev" ni le service "studio" en prod.
# Studio expose toute la DB sans auth -> fuite données.
# En prod, pas de fallback dev — env_file .env est requis, les secrets doivent exister.
services:
  db:
    env_file: .env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant en prod}
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: .env
    command: npm start
    volumes: !reset []
    ports:
      - "127.0.0.1:${PORT:-33333}:${PORT:-33333}"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquant en prod}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant en prod - 32+ chars}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN manquant en prod}
      NODE_ENV: production
    restart: always
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL manquant en prod - ex: https://app.babyfootauboulot.dev}"
    env_file: .env
    command: npx vite preview --host 0.0.0.0 --port 55174
    volumes: !reset []
    ports:
      - "127.0.0.1:${WEB_PORT:-55174}:${WEB_PORT:-55174}"
    environment:
      NODE_ENV: production
    restart: always
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
      args:
        PUBLIC_APP_URL: "${PUBLIC_APP_URL:?PUBLIC_APP_URL manquant en prod - ex: https://app.babyfootauboulot.dev}"
    env_file: .env
    command: npm run preview -- --host 0.0.0.0 --port 55175
    volumes: !reset []
    ports:
      - "127.0.0.1:${LANDING_PORT:-55175}:${LANDING_PORT:-55175}"
    environment:
      NODE_ENV: production
    restart: always
  # studio est volontairement ABSENT en prod
  # Toute tentative de `docker compose --profile dev` en prod doit être bloquée par le déploiement.
